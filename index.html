<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주간 생활계획표</title>

  <style>
    :root {
      --purple: #aaa0d5;
      --line: #e6e3ea;
      --text: #34313d;
      --muted: #747080;
      --slot-height: 42px;
      --time-col-width: 82px;
      --sleep: #d9c4e8;
      --study: #b9d9f1;
      --exercise: #f6c8a2;
      --meal: #cde6bd;
      --leisure: #f5d2de;
      --meditation: #e6dcab;
      --work: #cbd8f5;
      --other: #d8d8d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 1100px;
      background: #f8f7fa;
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .top-header {
      height: 76px;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      background: var(--purple);
    }

    .top-header h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .top-header p {
      margin: 0;
      font-size: 13px;
      opacity: 0.95;
    }

    .quote {
      text-align: right;
      font-size: 12px;
      line-height: 1.7;
      opacity: 0.9;
    }

    .toolbar {
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border-bottom: 1px solid var(--line);
    }

    .toolbar button {
      border: 1px solid #d8d3e7;
      padding: 8px 12px;
      border-radius: 8px;
      background: white;
      color: #514a69;
      font-weight: 700;
    }

    .toolbar button:hover {
      background: #f0ecfa;
    }

    #weekTitle {
      min-width: 200px;
      margin-left: 8px;
      font-weight: 800;
      font-size: 16px;
    }

    .hint {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
    }

    .app-layout {
      display: grid;
      grid-template-columns: minmax(850px, 1fr) 290px;
      min-height: calc(100vh - 132px);
    }

    .calendar-wrap {
      overflow: auto;
      padding: 16px;
      background: white;
    }

    .calendar {
      min-width: 920px;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .calendar-head {
      display: grid;
      grid-template-columns: var(--time-col-width) repeat(7, minmax(112px, 1fr));
      height: 58px;
      background: #fff;
    }

    .time-head,
    .day-head {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .day-head {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
    }

    .day-head .date {
      font-size: 12px;
      color: var(--muted);
    }

    .day-head .weekday {
      font-size: 14px;
      font-weight: 800;
    }

    .day-head.saturday .weekday {
      color: #5c83d9;
    }

    .day-head.sunday .weekday {
      color: #e78585;
    }

    .day-head.today {
      background: #f4f0ff;
    }

    .calendar-body {
      display: grid;
      grid-template-columns: var(--time-col-width) repeat(7, minmax(112px, 1fr));
    }

    .time-labels {
      background: white;
    }

    .time-label {
      height: var(--slot-height);
      padding: 6px 8px 0 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #5d5867;
      font-size: 11px;
      text-align: right;
    }

    .day-column {
      position: relative;
      height: calc(var(--slot-height) * 32);
      border-right: 1px solid var(--line);
      background:
        repeating-linear-gradient(
          to bottom,
          #ffffff 0,
          #ffffff calc(var(--slot-height) - 1px),
          var(--line) calc(var(--slot-height) - 1px),
          var(--line) var(--slot-height)
        );
    }

    .day-column::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(var(--slot-height) * 2 - 1px),
          rgba(167, 160, 180, 0.22) calc(var(--slot-height) * 2 - 1px),
          rgba(167, 160, 180, 0.22) calc(var(--slot-height) * 2)
        );
    }

    .day-column.drag-over {
      background-color: #f2eeff;
    }

    .event {
      position: absolute;
      left: 4px;
      right: 4px;
      z-index: 2;
      min-height: 34px;
      overflow: hidden;
      padding: 6px 7px;
      border-radius: 6px;
      border-left: 4px solid rgba(0, 0, 0, 0.13);
      box-shadow: 0 1px 3px rgba(41, 31, 65, 0.09);
      cursor: grab;
      user-select: none;
    }

    .event:active {
      cursor: grabbing;
    }

    .event.completed {
      opacity: 0.62;
    }

    .event.completed .event-title {
      text-decoration: line-through;
    }

    .event-top {
      display: flex;
      align-items: flex-start;
      gap: 5px;
    }

    .complete-check {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #66568b;
      cursor: pointer;
    }

    .event-title {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-weight: 800;
      font-size: 12px;
      line-height: 1.3;
      word-break: keep-all;
    }

    .event-time,
    .event-note {
      margin-top: 4px;
      padding-left: 20px;
      overflow: hidden;
      color: rgba(45, 40, 55, 0.7);
      font-size: 10px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .category-sleep { background: var(--sleep); }
    .category-study { background: var(--study); }
    .category-exercise { background: var(--exercise); }
    .category-meal { background: var(--meal); }
    .category-leisure { background: var(--leisure); }
    .category-meditation { background: var(--meditation); }
    .category-work { background: var(--work); }
    .category-other { background: var(--other); }

    .side-panel {
      padding: 16px;
      border-left: 1px solid var(--line);
      background: #fff;
    }

    .side-section {
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 2px solid #eeeaf4;
    }

    .side-section h2 {
      margin: 0 0 10px;
      color: #4e4961;
      font-size: 16px;
    }

    .side-section textarea,
    .side-section input {
      width: 100%;
      resize: vertical;
      outline: none;
      border: 1px solid #ddd7ea;
      border-radius: 7px;
      padding: 10px;
      color: var(--text);
      line-height: 1.6;
      background: #fcfbff;
    }

    .side-section textarea:focus,
    .side-section input:focus {
      border-color: #9c8aca;
      box-shadow: 0 0 0 3px rgba(156, 138, 202, 0.12);
    }

    #goalText {
      min-height: 135px;
    }

    #wishText {
      min-height: 90px;
    }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #5e5968;
    }

    .legend-color {
      width: 13px;
      height: 13px;
      border-radius: 4px;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(35, 29, 46, 0.42);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(470px, 100%);
      padding: 24px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 18px 55px rgba(28, 20, 44, 0.28);
    }

    .modal h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #5f5a69;
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      outline: none;
      border: 1px solid #dcd6e7;
      border-radius: 8px;
      padding: 10px;
      background: white;
    }

    .field textarea {
      min-height: 88px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .modal-actions button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 800;
    }

    .btn-cancel {
      color: #625c6f;
      background: #eeeaf3;
    }

    .btn-delete {
      display: none;
      margin-right: auto;
      color: #af4e58;
      background: #fde7e9;
    }

    .btn-save {
      color: white;
      background: #8272b5;
    }
  </style>
</head>

<body>
  <header class="top-header">
    <div>
      <h1>주간 생활계획</h1>
      <p id="headerDate">주 시작일</p>
    </div>
    <div class="quote">
      # 하루의 작은 계획이 쌓여<br />
      # 내가 원하는 삶의 리듬이 됩니다
    </div>
  </header>

  <nav class="toolbar">
    <button id="prevWeek">← 이전 주</button>
    <button id="todayWeek">오늘</button>
    <button id="nextWeek">다음 주 →</button>
    <strong id="weekTitle"></strong>
    <span class="hint">빈 시간 칸 클릭: 일정 추가 · 일정 드래그: 시간 변경</span>
  </nav>

  <main class="app-layout">
    <section class="calendar-wrap">
      <div class="calendar">
        <div class="calendar-head" id="calendarHead"></div>
        <div class="calendar-body" id="calendarBody"></div>
      </div>
    </section>

    <aside class="side-panel">
      <section class="side-section">
        <h2>2026년도 목표</h2>
        <textarea id="goalText" placeholder="예시
신체: 규칙적인 운동과 건강 관리
운동: 주 3회 이상
공부: 매일 꾸준히
독서: 한 달 2권"></textarea>
      </section>

      <section class="side-section">
        <h2>이번 주 목표 및 할 일</h2>
        <textarea id="weeklyText" placeholder="1. 운동 3회
2. 과제 마무리
3. 책 50페이지 읽기"></textarea>
      </section>

      <section class="side-section">
        <h2>위시 리스트</h2>
        <textarea id="wishText" placeholder="1. 가고 싶은 전시
2. 보고 싶은 영화"></textarea>
      </section>

      <section class="side-section">
        <h2>카테고리 색상</h2>
        <div class="legend">
          <div class="legend-item"><span class="legend-color" style="background:var(--exercise)"></span>운동</div>
          <div class="legend-item"><span class="legend-color" style="background:var(--meal)"></span>식사</div>
          <div class="legend-item"><span class="legend-color" style="background:var(--study)"></span>공부</div>
          <div class="legend-item"><span class="legend-color" style="background:var(--leisure)"></span>여가</div>
          <div class="legend-item"><span class="legend-color" style="background:var(--meditation)"></span>묵상</div>
          <div class="legend-item"><span class="legend-color" style="background:var(--sleep)"></span>수면</div>
          <div class="legend-item"><span class="legend-color" style="background:var(--work)"></span>업무</div>
          <div class="legend-item"><span class="legend-color" style="background:var(--other)"></span>기타</div>
        </div>
      </section>
    </aside>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <form class="modal" id="scheduleForm">
      <h2 id="modalTitle">일정 추가</h2>

      <div class="field">
        <label for="scheduleTitle">일정 이름</label>
        <input id="scheduleTitle" required maxlength="60" placeholder="예: 헬스장, 성경 읽기, 점심 식사" />
      </div>

      <div class="form-row">
        <div class="field">
          <label for="scheduleDate">날짜</label>
          <input id="scheduleDate" type="date" required />
        </div>

        <div class="field">
          <label for="scheduleTime">시작 시간</label>
          <input id="scheduleTime" type="time" step="1800" required />
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="scheduleDuration">소요 시간</label>
          <select id="scheduleDuration">
            <option value="30">30분</option>
            <option value="60" selected>1시간</option>
            <option value="90">1시간 30분</option>
            <option value="120">2시간</option>
            <option value="180">3시간</option>
            <option value="240">4시간</option>
            <option value="480">8시간</option>
          </select>
        </div>

        <div class="field">
          <label for="scheduleCategory">카테고리</label>
          <select id="scheduleCategory">
            <option value="exercise">운동</option>
            <option value="meal">식사</option>
            <option value="study">공부</option>
            <option value="leisure">여가</option>
            <option value="meditation">묵상</option>
            <option value="sleep">수면</option>
            <option value="work">업무</option>
            <option value="other">기타</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="scheduleMemo">메모</label>
        <textarea id="scheduleMemo" maxlength="300" placeholder="준비물, 장소, 세부 목표 등을 기록하세요."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-delete" id="deleteSchedule">삭제</button>
        <button type="button" class="btn-cancel" id="closeModal">취소</button>
        <button type="submit" class="btn-save">저장</button>
      </div>
    </form>
  </div>

  <script>
    const SLOT_HEIGHT = 42;
    const START_HOUR = 6;
    const END_HOUR = 22;
    const SLOT_MINUTES = 30;
    const STORAGE_KEY = "life-planner-schedules-v1";

    const categoryKeywords = {
      exercise: ["운동", "헬스", "러닝", "런닝", "조깅", "요가", "필라테스", "수영", "산책", "축구", "농구", "등산", "스트레칭", "체력"],
      meal: ["식사", "밥", "아침", "점심", "저녁", "간식", "커피", "브런치", "외식", "도시락", "요리"],
      study: ["공부", "강의", "수업", "과제", "시험", "복습", "예습", "독서", "책", "영어", "학습", "코딩", "자격증", "학교"],
      leisure: ["여가", "영화", "드라마", "게임", "친구", "데이트", "여행", "전시", "공연", "쇼핑", "취미", "유튜브", "넷플릭스"],
      meditation: ["묵상", "기도", "성경", "예배", "찬양", "큐티", "qt", "명상", "교회"],
      sleep: ["수면", "잠", "취침", "기상", "낮잠"],
      work: ["업무", "회의", "미팅", "출근", "퇴근", "프로젝트", "알바", "작업", "발표", "메일"]
    };

    const categoryNames = {
      exercise: "운동",
      meal: "식사",
      study: "공부",
      leisure: "여가",
      meditation: "묵상",
      sleep: "수면",
      work: "업무",
      other: "기타"
    };

    let schedules = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let editingId = null;
    let weekStart = getMonday(new Date());

    const calendarHead = document.getElementById("calendarHead");
    const calendarBody = document.getElementById("calendarBody");
    const weekTitle = document.getElementById("weekTitle");
    const headerDate = document.getElementById("headerDate");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const scheduleForm = document.getElementById("scheduleForm");
    const deleteButton = document.getElementById("deleteSchedule");

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function toDateKey(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function parseDateKey(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function getMonday(date) {
      const copied = new Date(date);
      copied.setHours(0, 0, 0, 0);
      const day = copied.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      copied.setDate(copied.getDate() + diff);
      return copied;
    }

    function formatKoreanDate(date) {
      return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
    }

    function getWeekDates() {
      return Array.from({ length: 7 }, (_, index) => {
        const date = new Date(weekStart);
        date.setDate(weekStart.getDate() + index);
        return date;
      });
    }

    function timeToMinutes(time) {
      const [hour, minute] = time.split(":").map(Number);
      return hour * 60 + minute;
    }

    function minutesToTime(minutes) {
      const normalized = Math.max(0, Math.min(23 * 60 + 30, minutes));
      return `${pad(Math.floor(normalized / 60))}:${pad(normalized % 60)}`;
    }

    function autoCategory(text) {
      const lowerText = text.toLowerCase();

      for (const [category, keywords] of Object.entries(categoryKeywords)) {
        if (keywords.some(keyword => lowerText.includes(keyword))) {
          return category;
        }
      }

      return "other";
    }

    function saveSchedules() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedules));
    }

    function saveSideNotes() {
      ["goalText", "weeklyText", "wishText"].forEach(id => {
        localStorage.setItem(`life-planner-${id}`, document.getElementById(id).value);
      });
    }

    function loadSideNotes() {
      ["goalText", "weeklyText", "wishText"].forEach(id => {
        document.getElementById(id).value = localStorage.getItem(`life-planner-${id}`) || "";
        document.getElementById(id).addEventListener("input", saveSideNotes);
      });
    }

    function renderCalendar() {
      const weekDates = getWeekDates();
      const todayKey = toDateKey(new Date());
      const weekdays = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];

      weekTitle.textContent = `${formatKoreanDate(weekDates[0])} ~ ${formatKoreanDate(weekDates[6])}`;
      headerDate.textContent = `주 시작일: ${formatKoreanDate(weekDates[0])}`;

      calendarHead.innerHTML = `<div class="time-head"></div>`;

      weekDates.forEach((date, index) => {
        const dateKey = toDateKey(date);
        const weekendClass = index === 5 ? "saturday" : index === 6 ? "sunday" : "";
        const todayClass = dateKey === todayKey ? "today" : "";

        calendarHead.innerHTML += `
          <div class="day-head ${weekendClass} ${todayClass}">
            <span class="date">${date.getMonth() + 1}월 ${date.getDate()}일</span>
            <span class="weekday">${weekdays[index]}</span>
          </div>
        `;
      });

      const slots = (END_HOUR - START_HOUR) * 2;
      let timeLabels = "";

      for (let slot = 0; slot < slots; slot++) {
        const minutes = START_HOUR * 60 + slot * SLOT_MINUTES;
        const hour = Math.floor(minutes / 60);
        const minute = minutes % 60;
        const label = minute === 0 ? `오전/오후 ${hour > 12 ? hour - 12 : hour}시` : `${hour > 12 ? hour - 12 : hour}시 30분`;

        timeLabels += `<div class="time-label">${label}</div>`;
      }

      calendarBody.innerHTML = `<div class="time-labels">${timeLabels}</div>`;

      weekDates.forEach(date => {
        const dateKey = toDateKey(date);
        const column = document.createElement("div");
        column.className = "day-column";
        column.dataset.date = dateKey;

        column.addEventListener("click", event => {
          if (event.target.closest(".event")) return;

          const rect = column.getBoundingClientRect();
          const clickedY = event.clientY - rect.top;
          const clickedSlot = Math.floor(clickedY / SLOT_HEIGHT);
          const clickedMinutes = START_HOUR * 60 + clickedSlot * SLOT_MINUTES;

          openCreateModal(dateKey, minutesToTime(clickedMinutes));
        });

        column.addEventListener("dragover", event => {
          event.preventDefault();
          column.classList.add("drag-over");
        });

        column.addEventListener("dragleave", () => {
          column.classList.remove("drag-over");
        });

        column.addEventListener("drop", event => {
          event.preventDefault();
          column.classList.remove("drag-over");

          const eventId = event.dataTransfer.getData("text/plain");
          const schedule = schedules.find(item => item.id === eventId);
          if (!schedule) return;

          const rect = column.getBoundingClientRect();
          const dropY = event.clientY - rect.top;
          const slot = Math.max(0, Math.min(31, Math.floor(dropY / SLOT_HEIGHT)));
          const newMinutes = START_HOUR * 60 + slot * SLOT_MINUTES;

          schedule.date = dateKey;
          schedule.time = minutesToTime(newMinutes);

          saveSchedules();
          renderCalendar();
        });

        const daySchedules = schedules
          .filter(item => item.date === dateKey)
          .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

        daySchedules.forEach(schedule => {
          const startMinutes = timeToMinutes(schedule.time);
          const top = ((startMinutes - START_HOUR * 60) / SLOT_MINUTES) * SLOT_HEIGHT;
          const height = Math.max((schedule.duration / SLOT_MINUTES) * SLOT_HEIGHT - 4, 34);

          if (top < 0 || top > column.clientHeight + SLOT_HEIGHT) return;

          const eventElement = document.createElement("div");
          eventElement.className = `event category-${schedule.category} ${schedule.completed ? "completed" : ""}`;
          eventElement.draggable = true;
          eventElement.style.top = `${Math.max(0, top + 2)}px`;
          eventElement.style.height = `${height}px`;

          eventElement.innerHTML = `
            <div class="event-top">
              <input
                class="complete-check"
                type="checkbox"
                ${schedule.completed ? "checked" : ""}
                aria-label="완료 처리"
              />
              <div class="event-title">${escapeHtml(schedule.title)}</div>
            </div>
            <div class="event-time">${schedule.time} · ${schedule.duration}분 · ${categoryNames[schedule.category]}</div>
            ${schedule.memo ? `<div class="event-note">${escapeHtml(schedule.memo)}</div>` : ""}
          `;

          eventElement.addEventListener("dragstart", event => {
            event.dataTransfer.setData("text/plain", schedule.id);
            event.dataTransfer.effectAllowed = "move";
          });

          eventElement.querySelector(".complete-check").addEventListener("click", event => {
            event.stopPropagation();
            schedule.completed = event.target.checked;
            saveSchedules();
            renderCalendar();
          });

          eventElement.addEventListener("click", event => {
            if (!event.target.classList.contains("complete-check")) {
              openEditModal(schedule.id);
            }
          });

          column.appendChild(eventElement);
        });

        calendarBody.appendChild(column);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function openCreateModal(date, time) {
      editingId = null;
      document.getElementById("modalTitle").textContent = "일정 추가";
      document.getElementById("scheduleTitle").value = "";
      document.getElementById("scheduleDate").value = date;
      document.getElementById("scheduleTime").value = time;
      document.getElementById("scheduleDuration").value = "60";
      document.getElementById("scheduleCategory").value = "other";
      document.getElementById("scheduleMemo").value = "";
      deleteButton.style.display = "none";

      modalBackdrop.classList.add("open");
      setTimeout(() => document.getElementById("scheduleTitle").focus(), 30);
    }

    function openEditModal(id) {
      const schedule = schedules.find(item => item.id === id);
      if (!schedule) return;

      editingId = id;
      document.getElementById("modalTitle").textContent = "일정 수정";
      document.getElementById("scheduleTitle").value = schedule.title;
      document.getElementById("scheduleDate").value = schedule.date;
      document.getElementById("scheduleTime").value = schedule.time;
      document.getElementById("scheduleDuration").value = schedule.duration;
      document.getElementById("scheduleCategory").value = schedule.category;
      document.getElementById("scheduleMemo").value = schedule.memo || "";
      deleteButton.style.display = "block";

      modalBackdrop.classList.add("open");
      setTimeout(() => document.getElementById("scheduleTitle").focus(), 30);
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
      editingId = null;
    }

    document.getElementById("scheduleTitle").addEventListener("input", event => {
      if (!editingId) {
        document.getElementById("scheduleCategory").value = autoCategory(event.target.value);
      }
    });

    scheduleForm.addEventListener("submit", event => {
      event.preventDefault();

      const title = document.getElementById("scheduleTitle").value.trim();
      const date = document.getElementById("scheduleDate").value;
      const time = document.getElementById("scheduleTime").value;
      const duration = Number(document.getElementById("scheduleDuration").value);
      const category = document.getElementById("scheduleCategory").value;
      const memo = document.getElementById("scheduleMemo").value.trim();

      if (!title || !date || !time) return;

      if (editingId) {
        const schedule = schedules.find(item => item.id === editingId);

        Object.assign(schedule, {
          title,
          date,
          time,
          duration,
          category,
          memo
        });
      } else {
        schedules.push({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          title,
          date,
          time,
          duration,
          category,
          memo,
          completed: false
        });
      }

      saveSchedules();
      closeModal();
      renderCalendar();
    });

    deleteButton.addEventListener("click", () => {
      if (!editingId) return;

      schedules = schedules.filter(item => item.id !== editingId);
      saveSchedules();
      closeModal();
      renderCalendar();
    });

    document.getElementById("closeModal").addEventListener("click", closeModal);

    modalBackdrop.addEventListener("click", event => {
      if (event.target === modalBackdrop) closeModal();
    });

    document.getElementById("prevWeek").addEventListener("click", () => {
      weekStart.setDate(weekStart.getDate() - 7);
      renderCalendar();
    });

    document.getElementById("nextWeek").addEventListener("click", () => {
      weekStart.setDate(weekStart.getDate() + 7);
      renderCalendar();
    });

    document.getElementById("todayWeek").addEventListener("click", () => {
      weekStart = getMonday(new Date());
      renderCalendar();
    });

    loadSideNotes();
    renderCalendar();
  </script>
</body>
</html>
